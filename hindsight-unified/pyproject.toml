[project]
name = "hindsight-unified"
version = "0.1.0"
description = "Unified agent-memory sidecar fusing Hindsight, EverOS, mempalace, OpenViking, MemOS and the tencentdb L0-L3 pipeline behind one interface for the Hermes agent."
readme = "README.md"
requires-python = ">=3.11"
# The sidecar core is intentionally dependency-free (stdlib http.server). The
# contributor engines below are OPTIONAL: each adapter imports its package
# lazily and degrades to the verbatim substrate when it is absent. Install the
# extras you want the brain/enrichers to use.
dependencies = []

[project.optional-dependencies]
# The retrieval/storage brain. Editable path dep on the in-repo package.
hindsight = ["hindsight-api-slim"]
# Enrichers (installed from their own repos / PyPI as available).
everos = ["everos"]
mempalace = ["mempalace"]
memos = ["MemoryOS"]
openviking = ["openviking"]
# Everything.
all = ["hindsight-api-slim", "everos", "mempalace", "MemoryOS", "openviking"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hindsight-unified = "hindsight_unified.server:serve"

[tool.uv.sources]
# When developed inside the hindsight monorepo the brain is a sibling package.
hindsight-api-slim = { path = "../hindsight-api-slim", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hindsight_unified"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
